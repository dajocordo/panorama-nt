<div class="container">
  <h1><img src="/nt-icono-mini.png" alt="Nuevo Testamento" /> Nuevo Testamento</h1>

  <div class="search-container">
    <input 
      type="text" 
      [(ngModel)]="buscarLibro" 
      placeholder="Buscar libro o autor..." 
      autocomplete="off" 
    />
  </div>

  <div class="button-container">
    <button (click)="toggleExpandirTodo()" class="toggle-btn">
      {{ expandirTodo ? '✕ Contraer todo' : '+ Expandir todo' }}
    </button>
  </div>
  
  <div class="libros-grid">
    <div class="libro-card" *ngFor="let libro of librosFiltrados">
      <div class="card-header">
        <div class="header-content">
          <div>
            <h2>{{ libro.libro }}</h2>
            <p class="autor">{{ libro.autor }}</p>
          </div>
          <button class="copy-btn" (click)="copiarInfo(libro)" title="Copiar información">
            📋
          </button>
        </div>
      </div>
      
      <details class="acordion" [open]="expandirTodo">
        <summary>Ver detalles</summary>
        
        <div class="acordion-content">
          <div class="info-item">
            <strong>Fecha:</strong>
            <span>{{ libro.fecha }}</span>
          </div>
          
          <div class="info-item">
            <strong>Destinatarios:</strong>
            <span>{{ libro.destinatarios }}</span>
          </div>
          
          <div class="info-item">
            <strong>Propósito:</strong>
            <span>{{ libro.proposito }}</span>
          </div>
          
          <div class="info-item">
            <strong>Tema:</strong>
            <span>{{ libro.tema }}</span>
          </div>
          
          <div class="info-item">
            <strong>Bosquejo:</strong>
            <ul class="bosquejo-list">
              <li *ngFor="let punto of libro.bosquejo">{{ punto }}</li>
            </ul>
          </div>
        </div>
      </details>
    </div>
  </div>
</div>
